<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Table Allotment</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
width:90%;
max-width:380px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

select,input,button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#00c6ff;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:gray;
}

#result{
margin-top:15px;
min-height:25px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h2>Get Your Table Number</h2>

<select id="category">
<option>Project Competition</option>
<option>Poster Competition</option>
<option>Paper Presentation</option>
</select>

<input type="text" id="title" placeholder="Enter Your Title">

<button id="btn" onclick="allot()">Get Table</button>

<div id="result"></div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-HMPtwRpBBVcxFKakxe7DZy_skPOqgTzU9_eJ0dPrBjoQurTSz8Jv-M5eiB7bikcc/exec";

async function allot(){

let category=document.getElementById("category").value;
let title=document.getElementById("title").value.trim();
let btn=document.getElementById("btn");

if(title.length<3){
alert("Enter valid title");
return;
}

btn.disabled=true;
document.getElementById("result").innerHTML="Assigning...";

try{

let url = SCRIPT_URL +
"?category=" + encodeURIComponent(category) +
"&title=" + encodeURIComponent(title);

let response = await fetch(url);
let data = await response.json();

if(data.status==="duplicate"){
document.getElementById("result").innerHTML="⚠ Title already registered!";
btn.disabled=false;
}
else if(data.status==="full"){
document.getElementById("result").innerHTML="❌ No tables available.";
btn.disabled=false;
}
else if(data.status==="success"){
document.getElementById("result").innerHTML=
"✅ Your Table Number:<br><span style='font-size:30px'>" + data.table + "</span>";
document.getElementById("title").value="";
}
else{
document.getElementById("result").innerHTML="❌ Unexpected response.";
btn.disabled=false;
}

}catch(err){
document.getElementById("result").innerHTML="❌ Network issue.";
btn.disabled=false;
}

}

</script>

</body>
</html>
