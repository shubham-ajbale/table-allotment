<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Table Allotment</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
width:90%;
max-width:380px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

select,input,button{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#00c6ff;
font-weight:bold;
cursor:pointer;
}

#result{
margin-top:15px;
font-weight:bold;
min-height:25px;
}
</style>
</head>

<body>

<div class="container">
<h2>Get Your Table Number</h2>

<form id="form"
action="https://script.google.com/macros/s/AKfycbw-HMPtwRpBBVcxFKakxe7DZy_skPOqgTzU9_eJ0dPrBjoQurTSz8Jv-M5eiB7bikcc/exec"
method="GET"
target="hidden_iframe"
onsubmit="return handleSubmit()">

<select name="category" id="category">
<option>Project Competition</option>
<option>Poster Competition</option>
<option>Paper Presentation</option>
</select>

<input type="text" name="title" id="title" placeholder="Enter Your Title" required>

<button type="submit">Get Table</button>

</form>

<div id="result"></div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

<script>

function handleSubmit(){

let title = document.getElementById("title").value.trim();

if(title.length < 3){
alert("Enter valid title");
return false;
}

document.getElementById("result").innerHTML="Assigning...";

setTimeout(()=>{
document.getElementById("result").innerHTML=
"✅ Table Assigned!<br>Check confirmation above if needed.";
document.getElementById("title").value="";
},1500);

return true;
}

</script>

</body>
</html>
